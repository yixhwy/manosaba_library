<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="魔裁图书馆：浏览、搜索魔裁全章节台词，并播放对应语音。" />
    <meta name="theme-color" content="#fbf7ec" />
    <title>魔裁图书馆</title>
    <link rel="icon" type="image/png" sizes="128x128" href="./assets/icon.png" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <img class="brand-icon" src="./assets/icon.png" alt="" />
          <div>
            <h1>魔裁图书馆</h1>
            <p>台词预览</p>
          </div>
        </div>
        <div class="search-area" id="searchArea">
          <button id="scopeBtn" type="button" class="scope-btn" aria-expanded="false">范围：全部</button>
          <label class="search" for="searchInput">
            <span class="search-icon" aria-hidden="true"></span>
            <input id="searchInput" type="search" placeholder="搜索台词或人物" aria-label="搜索台词或人物" autocomplete="off" />
          </label>
          <div id="scopePanel" class="scope-panel" hidden></div>
        </div>
      </header>

      <main class="browse-view">
        <aside class="sidebar" aria-label="场景列表">
          <div class="sidebar-title">章节目录</div>
          <nav id="chapterNav" class="chapter-nav"></nav>
        </aside>

        <section id="contentScroll" class="content">
          <div class="content-head">
            <h2 id="sceneTitle">正在加载…</h2>
            <p id="sceneMeta"></p>
          </div>
          <ul id="lineList" class="line-list" aria-live="polite"></ul>
        </section>
      </main>
    </div>

    <script src="./js/config.js"></script>
    <script src="./js/app-optimized.js"></script>
  </body>
</html>
